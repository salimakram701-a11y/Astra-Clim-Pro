    @keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes backdropIn{from{opacity:0}to{opacity:1}}
    @keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulseBadge{0%{transform:scale(1)}35%{transform:scale(1.12)}100%{transform:scale(1)}}

<body>
  <div id="root" class="loading">Chargement de Froid Plus Climatisation…</div>
  <div id="modal-root"></div><div id="toast-root"></div>
  <script>
  'use strict';
  const APP_VERSION='2.0.0', DB_NAME='astra-clim-pro', STORE='app', $=s=>document.querySelector(s);
  const today=()=>new Date().toISOString().slice(0,10), uid=()=>crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
  const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const money=v=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(v||0));
  const dateFR=v=>v ? new Intl.DateTimeFormat('fr-FR',{dateStyle:'medium'}).format(new Date(`${v}T12:00:00`)) : '—';
  const timeLabel=v=>v||'—';
  let state, session=JSON.parse(sessionStorage.getItem('astra-session')||'null'), active='dashboard', editingId=null, draftLines=[], pendingPhotos=[], signatureValue='';

  function blankState(){return {schema:2,updatedAt:new Date().toISOString(),dirty:false,clients:[],equipment:[],jobs:[],documents:[],stock:[],technicians:[],settings:{companyName:'Froid Plus Climatisation',companyAddress:'',companyPhone:'',companyEmail:'',notifications:false,cloud:null},localProfile:null};}
  function openDb(){return new Promise((ok,fail)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>ok(r.result);r.onerror=()=>fail(r.error);});}
  async function getLocal(){const db=await openDb();return new Promise((ok,fail)=>{const r=db.transaction(STORE).objectStore(STORE).get('state');r.onsuccess=()=>ok(r.result||null);r.onerror=()=>fail(r.error);});}
  async function putLocal(value){const db=await openDb();return new Promise((ok,fail)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).put(value,'state');r.onsuccess=()=>ok();r.onerror=()=>fail(r.error);});}
  function normalize(raw){const base=blankState(), data={...base,...(raw||{})};for(const k of ['clients','equipment','jobs','documents','stock','technicians'])if(!Array.isArray(data[k]))data[k]=[];data.settings={...base.settings,...(data.settings||{})};return data;}
  async function persist({render=true}={}){state.updatedAt=new Date().toISOString();await putLocal(state);if(render)renderApp();}
  async function mutate(work){work();state.dirty=true;await persist();queueSync();}
  function cloudData(){const {localProfile,...data}=state;data.settings={...data.settings,cloud:null};delete data.dirty;return data;}
  async function digest(value,salt){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(`${salt}:${value}`));return [...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('');}
  function currentUser(){return session?.user||null;}
  function hasCloud(){return Boolean(session?.token && state.settings.cloud?.url);}
  function statusClass(value){const s=String(value||'').toLowerCase();if(/terminée|payée|accepté|réglée|ok|disponible/.test(s))return 'good';if(/annul|refus|retard|critique/.test(s))return 'bad';if(/planifiée|attente|cours|brouillon|envoy/.test(s))return 'warn';return 'blue';}
  const badge=v=>`<span class="badge ${statusClass(v)}">${esc(v||'—')}</span>`;
  const clientName=id=>state.clients.find(x=>x.id===id)?.name||'Client supprimé';
  const clientAddress=id=>state.clients.find(x=>x.id===id)?.address?.trim()||'';
  const equipmentName=id=>{const x=state.equipment.find(y=>y.id===id);return x?`${x.brand||''} ${x.model||x.type||''}`.trim()||'Installation':'—'};
  function optionList(items,value,label){return items.map(x=>`<option value="${esc(x.id)}" ${x.id===value?'selected':''}>${esc(label(x))}</option>`).join('');}
  function toast(message,type=''){const d=document.createElement('div');d.className=`toast ${type}`;d.textContent=message;$('#toast-root').append(d);setTimeout(()=>d.classList.add('leaving'),3800);setTimeout(()=>d.remove(),4200);}

  async function init(){
    try {state=normalize(await getLocal());} catch(e){$('#root').innerHTML='<div class="auth"><div class="auth-card"><h2>Stockage indisponible</h2><p>Le navigateur bloque IndexedDB, nécessaire au mode hors connexion.</p></div></div>';return;}
    if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
    if(!session || (session.mode==='local' && !state.localProfile)) session=null;
    if(session) renderApp(); else renderAuth();
  }
  function renderAuth(tab='local'){
    const localExisting=!!state.localProfile;
    $('#root').className='';$('#root').innerHTML=`<div class="auth"><div class="auth-shell"><aside class="auth-intro"><div class="brand">FROID <i>PLUS</i><small>CLIMATISATION · TERRAIN & GESTION</small></div><h1>Le pilotage de votre activité, partout.</h1><p>Vos données restent disponibles sans réseau, puis se synchronisent avec votre espace équipe dès que la connexion revient.</p><ul><li>✓ Rapports signés et photos terrain</li><li>✓ Devis, factures et stock en temps réel</li><li>✓ Installation sur téléphone ou tablette</li></ul></aside><section class="auth-card"><h2>${localExisting?'Bon retour':'Démarrer avec Froid Plus Climatisation'}</h2><p>${localExisting?'Déverrouillez votre espace local ou connectez-vous à votre équipe.':'Créez un espace local, ou démarrez directement un espace équipe synchronisé.'}</p><div class="tabs"><button data-auth-tab="local" class="${tab==='local'?'active':''}">Sur cet appareil</button><button data-auth-tab="cloud" class="${tab==='cloud'?'active':''}">Espace équipe</button></div><div id="auth-form">${tab==='local'?localAuthForm(localExisting):cloudAuthForm()}</div></section></div></div>`;
    document.querySelectorAll('[data-auth-tab]').forEach(b=>b.onclick=()=>renderAuth(b.dataset.authTab));
    bindAuth(tab,localExisting);
  }
  function localAuthForm(existing){return existing?`<form id="local-login"><div class="field"><label>Code PIN</label><input class="input" id="pin" inputmode="numeric" type="password" autocomplete="current-password" required minlength="4" autofocus><div class="help">Ce code protège seulement les données de ce navigateur.</div></div><button class="btn" type="submit">Déverrouiller</button></form>`:`<form id="local-create"><div class="field"><label>Nom de l’entreprise</label><input class="input" id="company" required placeholder="Froid Plus Climatisation"></div><div class="field"><label>Votre nom</label><input class="input" id="name" required placeholder="Jean Dupont"></div><div class="field"><label>Code PIN</label><input class="input" id="pin" inputmode="numeric" type="password" required minlength="4" maxlength="20" placeholder="4 chiffres minimum"><div class="help">Pour un vrai travail d’équipe, utilisez plutôt « Espace équipe ».</div></div><button class="btn" type="submit">Créer l’espace local</button></form>`;}
  function cloudAuthForm(){return `<div class="notice blue">L’espace équipe utilise le serveur Froid Plus Climatisation. Il est à héberger sur votre serveur/cloud avant utilisation en production.</div><div class="tabs"><button data-cloud-view="login" class="active">Connexion</button><button data-cloud-view="create">Créer l’entreprise</button></div><div id="cloud-inner"></div>`;}
  function cloudLoginForm(){return `<form id="cloud-login"><div class="field"><label>Adresse du serveur</label><input class="input" id="server-url" type="url" required value="${esc(state.settings.cloud?.url||location.origin)}" placeholder="https://gestion.votre-entreprise.fr"></div><div class="field"><label>E-mail</label><input class="input" id="email" type="email" required autocomplete="username"></div><div class="field"><label>Mot de passe</label><input class="input" id="password" type="password" required autocomplete="current-password"></div><button class="btn" type="submit">Se connecter</button></form>`;}
  function cloudCreateForm(){return `<form id="cloud-create"><div class="field"><label>Adresse du serveur</label><input class="input" id="server-url" type="url" required value="${esc(state.settings.cloud?.url||location.origin)}"></div><div class="field"><label>Entreprise</label><input class="input" id="organisation" required></div><div class="field"><label>Votre nom</label><input class="input" id="name" required></div><div class="field"><label>E-mail administrateur</label><input class="input" id="email" type="email" required></div><div class="field"><label>Mot de passe</label><input class="input" id="password" type="password" required minlength="10"><div class="help">Au moins 10 caractères.</div></div><button class="btn" type="submit">Créer l’espace équipe</button></form>`;}
  function bindAuth(tab,localExisting){
    if(tab==='local'){$('#local-login, #local-create')?.addEventListener('submit',async e=>{e.preventDefault();const pin=$('#pin').value;if(localExisting){if(await digest(pin,state.localProfile.salt)!==state.localProfile.pinHash)return toast('Code PIN incorrect.','bad');session={mode:'local',user:{name:state.localProfile.name,role:'Administrateur'}};}else{const salt=uid();state.localProfile={name:$('#name').value.trim(),salt,pinHash:await digest(pin,salt)};state.settings.companyName=$('#company').value.trim()||'Froid Plus Climatisation';await persist({render:false});session={mode:'local',user:{name:state.localProfile.name,role:'Administrateur'}};}sessionStorage.setItem('astra-session',JSON.stringify(session));renderApp();});return;}
    const inner=$('#cloud-inner');inner.innerHTML=cloudLoginForm();document.querySelectorAll('[data-cloud-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-cloud-view]').forEach(x=>x.classList.toggle('active',x===b));inner.innerHTML=b.dataset.cloudView==='create'?cloudCreateForm():cloudLoginForm();bindCloudForm();});bindCloudForm();
  }
  function bindCloudForm(){const form=$('#cloud-login, #cloud-create');form?.addEventListener('submit',async e=>{e.preventDefault();const isCreate=form.id==='cloud-create',url=$('#server-url').value.trim().replace(/\/$/,'');try{const body=isCreate?{organisation:$('#organisation').value,name:$('#name').value,email:$('#email').value,password:$('#password').value}:{email:$('#email').value,password:$('#password').value};const res=await fetch(`${url}/api/auth/${isCreate?'bootstrap':'login'}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const result=await res.json();if(!res.ok)throw Error(result.error||'Connexion impossible');session={mode:'cloud',token:result.token,user:result.user,organisation:result.organisation};state.settings.cloud={url,revision:0};const snap=await api('/api/snapshot');state={...normalize(snap.data),localProfile:state.localProfile};state.settings={...state.settings,cloud:{url,revision:snap.revision}};state.dirty=false;await persist({render:false});sessionStorage.setItem('astra-session',JSON.stringify(session));renderApp();toast(isCreate?'Espace équipe créé.':'Connecté à l’espace équipe.','good');}catch(err){toast(err.message||'Connexion impossible.','bad');}});}

  function renderApp(){if(!session)return renderAuth();$('#root').className='';$('#root').innerHTML=`<div class="app"><aside class="side"><div class="brand">FROID <i>PLUS</i><small>CLIMATISATION · V${APP_VERSION}</small></div><nav class="nav">${navButton('dashboard','🏠','Tableau de bord')}${navButton('clients','👥','Clients')}${navButton('equipment','❄️','Installations')}${navButton('jobs','🛠️','Interventions')}${navButton('planning','📅','Planning')}${navButton('documents','💶','Devis & factures')}${navButton('stock','📦','Stock')}${navButton('settings','⚙️','Réglages')}</nav><div class="side-foot"><b>${esc(state.settings.companyName||'Froid Plus Climatisation')}</b>${hasCloud()?'☁ Synchronisation équipe':'▣ Mode hors ligne'}</div></aside><main class="main" id="view"></main></div>`;document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{active=b.dataset.nav;renderApp();});renderView();}
  const navButton=(id,icon,label)=>`<button data-nav="${id}" class="${active===id?'active':''}" aria-label="${label}"><span class="ico">${icon}</span>${label}</button>`;
  function header(title,sub,buttons=''){return `<div class="topbar"><div><h1>${title}</h1><p>${sub||''}</p></div><div class="actions-inline"><span class="sync-pill">${hasCloud()?state.dirty?'Modifications à synchroniser':'Synchronisé localement':navigator.onLine?'Hors ligne · données locales':'Sans connexion'}</span>${buttons}</div></div>`;}
  function renderView(){const v=$('#view');if(active==='dashboard')v.innerHTML=dashboard();if(active==='clients')v.innerHTML=clientsView();if(active==='equipment')v.innerHTML=equipmentView();if(active==='jobs')v.innerHTML=jobsView();if(active==='planning')v.innerHTML=planningView();if(active==='documents')v.innerHTML=documentsView();if(active==='stock')v.innerHTML=stockView();if(active==='settings')v.innerHTML=settingsView();bindView();v.style.animation='none';void v.offsetWidth;v.style.animation='';if(active==='dashboard')animateCounters();}
  function animateCounters(){document.querySelectorAll('.stat .value[data-count]').forEach(el=>{const target=Number(el.dataset.count)||0,suffix=el.dataset.suffix||'',start=performance.now(),dur=520;function frame(now){const p=Math.min(1,(now-start)/dur),eased=1-Math.pow(1-p,3);el.textContent=Math.round(eased*target)+suffix;if(p<1)requestAnimationFrame(frame);}requestAnimationFrame(frame);});}
  function dashboard(){const todayJobs=state.jobs.filter(x=>x.date===today()),openQuotes=state.documents.filter(x=>x.type==='Devis'&&['Brouillon','Envoyé'].includes(x.status)),low=state.stock.filter(x=>Number(x.qty)<=Number(x.min));const doneMonth=state.jobs.filter(x=>x.status==='Terminée'&&x.date.slice(0,7)===today().slice(0,7)).length;return `${header(`Bonjour ${esc(currentUser()?.name?.split(' ')[0]||'')}`,"Voici l’essentiel de votre activité.",`<button class="btn secondary" data-action="sync">↻ Synchroniser</button><button class="btn" data-action="job-new">+ Intervention</button>`)}<div class="grid stats"><div class="card stat"><div class="label">Interventions aujourd’hui</div><div class="value" data-count="${todayJobs.length}">0</div><div class="hint">${state.jobs.filter(x=>x.date>today()&&x.status!=='Terminée').length} à venir</div></div><div class="card stat"><div class="label">Clients actifs</div><div class="value" data-count="${state.clients.length}">0</div><div class="hint">Parc : ${state.equipment.length} installation(s)</div></div><div class="card stat"><div class="label">Devis en attente</div><div class="value" data-count="${openQuotes.length}">0</div><div class="hint">${money(openQuotes.reduce((s,x)=>s+docTotal(x),0))}</div></div><div class="card stat"><div class="label">Stock à surveiller</div><div class="value" data-count="${low.length}">0</div><div class="hint">${doneMonth} intervention(s) terminée(s) ce mois</div></div></div><div class="grid layout-two"><section><div class="section-title"><h2>Prochaines interventions</h2><button class="btn ghost small" data-go="jobs">Voir toutes →</button></div><div class="card">${jobRows(state.jobs.filter(x=>x.status!=='Terminée').sort(sortJobs).slice(0,6),true)}</div></section><section><div class="section-title"><h2>Alertes</h2></div><div class="card"><div class="alert-list">${low.length?low.slice(0,5).map(x=>`<div class="alert-row"><div><b>${esc(x.name)}</b><div class="muted small-text">Seuil : ${esc(x.min)} ${esc(x.unit||'u.')}</div></div><div class="stock-low">${esc(x.qty)} ${esc(x.unit||'u.')}</div></div>`).join(''):'<div class="empty"><strong>Tout va bien</strong>Aucun stock critique.</div>'}</div></div></section></div><section><div class="section-title"><h2>Derniers documents</h2><button class="btn ghost small" data-go="documents">Voir les documents →</button></div><div class="card">${documentRows(state.documents.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5),true)}</div></section>`;}
  function clientsView(){return `${header('Clients','Gérez les coordonnées, le parc et l’historique.',`<button class="btn" data-action="client-new">+ Ajouter un client</button>`)}<div class="filters"><input class="input search" id="client-search" placeholder="Rechercher un nom, téléphone ou ville…"></div><div class="card table-wrap"><div id="clients-table">${clientRows(state.clients)}</div></div>`;}
  function clientRows(items){return items.length?`<table class="table"><thead><tr><th>Client</th><th>Coordonnées</th><th>Adresse</th><th>Parc</th><th></th></tr></thead><tbody>${items.map(x=>`<tr><td><b>${esc(x.name)}</b><div class="muted small-text">${esc(x.contact||'')}</div></td><td>${esc(x.phone||'—')}<div class="muted small-text">${esc(x.email||'')}</div></td><td>${esc(x.address||'—')}</td><td>${state.equipment.filter(e=>e.clientId===x.id).length} appareil(s)</td><td class="actions-cell">${x.address?`<button class="btn ghost small" data-action="client-waze" data-id="${x.id}">🧭 Waze</button>`:''}<button class="btn secondary small" data-action="client-edit" data-id="${x.id}">Modifier</button></td></tr>`).join('')}</tbody></table>`:empty('Aucun client','Ajoutez votre premier client pour constituer votre parc.');}
  function equipmentView(){return `${header('Installations','Parc matériel et traçabilité de chaque climatiseur.',`<button class="btn" data-action="equipment-new">+ Ajouter une installation</button>`)}${state.clients.length?'':'<div class="notice warn">Ajoutez d’abord un client pour lui rattacher une installation.</div>'}<div class="card table-wrap">${equipmentRows(state.equipment)}</div>`;}
  function equipmentRows(items){return items.length?`<table class="table"><thead><tr><th>Client</th><th>Équipement</th><th>Caractéristiques</th><th>Identifiant</th><th></th></tr></thead><tbody>${items.map(x=>`<tr><td><b>${esc(clientName(x.clientId))}</b></td><td>${esc(x.type||'Climatiseur')}<div class="muted small-text">${esc([x.brand,x.model].filter(Boolean).join(' '))}</div></td><td>${esc([x.power,x.fluid].filter(Boolean).join(' · ')||'—')}</td><td>${esc(x.serial||'—')}</td><td class="actions-cell"><button class="btn secondary small" data-action="equipment-edit" data-id="${x.id}">Modifier</button></td></tr>`).join('')}</tbody></table>`:empty('Aucune installation','Chaque installation est rattachée à un client et suit son historique.');}
  function jobsView(){return `${header('Interventions','Planifiez, suivez le terrain et faites signer vos rapports.',`<button class="btn" data-action="job-new">+ Nouvelle intervention</button>`)}<div class="filters"><select class="select" id="job-status-filter" style="max-width:190px"><option value="">Tous les statuts</option>${['Planifiée','En cours','Terminée','Annulée'].map(x=>`<option>${x}</option>`).join('')}</select><input class="input search" id="job-search" placeholder="Rechercher client ou technicien…"></div><div class="card table-wrap"><div id="jobs-table">${jobRows(state.jobs.slice().sort(sortJobs))}</div></div>`;}
  function sortJobs(a,b){return `${a.date}${a.time||''}`.localeCompare(`${b.date}${b.time||''}`);}
  function jobRows(items,short=false){return items.length?`<table class="table"><thead><tr><th>Date / heure</th><th>Client</th>${short?'':'<th>Technicien</th>'}<th>Type</th><th>Statut</th>${short?'':'<th></th>'}</tr></thead><tbody>${items.map(x=>`<tr><td><b>${dateFR(x.date)}</b><div class="muted small-text">${timeLabel(x.time)} · ${esc(x.duration||'—')}</div></td><td>${esc(clientName(x.clientId))}<div class="muted small-text">${esc(equipmentName(x.equipmentId))}</div></td>${short?'':`<td>${esc(x.technician||'—')}</td>`}<td>${esc(x.type||'—')}</td><td>${badge(x.status)}</td>${short?'':`<td class="actions-cell">${clientAddress(x.clientId)?`<button class="btn ghost small" data-action="job-waze" data-id="${x.id}">🧭</button>`:''}<button class="btn secondary small" data-action="job-open" data-id="${x.id}">Ouvrir</button></td>`}</tr>`).join('')}</tbody></table>`:empty('Aucune intervention','Planifiez votre première visite terrain.');}
  function planningView(){const start=weekStart($('#planning-date')?.value||today());const days=Array.from({length:7},(_,i)=>addDays(start,i));return `${header('Planning','Vue hebdomadaire des interventions.',`<button class="btn" data-action="job-new">+ Intervention</button>`)}<div class="filters"><label> Semaine du <input class="input" id="planning-date" type="date" value="${start}" style="width:auto;margin-left:6px"></label></div><div class="calendar">${days.map(d=>{const entries=state.jobs.filter(x=>x.date===d).sort(sortJobs);return `<div class="day"><div class="day-head">${new Intl.DateTimeFormat('fr-FR',{weekday:'short'}).format(new Date(`${d}T12:00`))}<b>${new Date(`${d}T12:00`).getDate()}</b></div>${entries.map(x=>`<div class="job-chip ${x.status==='Terminée'?'done':''}" data-action="job-open" data-id="${x.id}"><span class="time">${esc(x.time||'—')}</span> · ${esc(clientName(x.clientId))}<br><span>${esc(x.type||'Intervention')}</span></div>`).join('')||'<div class="muted small-text">Libre</div>'}</div>`;}).join('')}</div>`;}
  function documentsView(){return `${header('Devis & factures','Créez vos documents, puis imprimez-les ou enregistrez-les en PDF.',`<button class="btn" data-action="document-new">+ Nouveau document</button>`)}<div class="card table-wrap">${documentRows(state.documents.slice().sort((a,b)=>b.date.localeCompare(a.date)))}</div>`;}
  function docTotal(x){return (x.lines||[]).reduce((s,l)=>s+(Number(l.qty)||0)*(Number(l.unitPrice)||0),0);}
  function documentRows(items,short=false){return items.length?`<table class="table"><thead><tr><th>N°</th><th>Client</th><th>Date</th><th>Montant TTC</th><th>Statut</th>${short?'':'<th></th>'}</tr></thead><tbody>${items.map(x=>`<tr><td><b>${esc(x.number||'—')}</b><div class="muted small-text">${esc(x.type)}</div></td><td>${esc(clientName(x.clientId))}</td><td>${dateFR(x.date)}</td><td><b>${money(docTotal(x))}</b></td><td>${badge(x.status)}</td>${short?'':`<td class="actions-cell"><button class="btn secondary small" data-action="document-open" data-id="${x.id}">Ouvrir</button></td>`}</tr>`).join('')}</tbody></table>`:empty('Aucun devis ou facture','Créez votre premier document.');}
  function stockView(){const low=state.stock.filter(x=>Number(x.qty)<=Number(x.min));return `${header('Stock',low.length?`${low.length} article(s) sous le seuil d’alerte.`:'Tous les seuils sont respectés.',`<button class="btn" data-action="stock-new">+ Ajouter un article</button>`)}${low.length?'<div class="notice warn">Les lignes en rouge demandent un réapprovisionnement.</div>':''}<div class="card table-wrap">${stockRows(state.stock)}</div>`;}
  function stockRows(items){return items.length?`<table class="table"><thead><tr><th>Article</th><th>Référence</th><th>Quantité</th><th>Seuil</th><th>État</th><th></th></tr></thead><tbody>${items.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.sku||'—')}</td><td class="${Number(x.qty)<=Number(x.min)?'stock-low':''}">${esc(x.qty)} ${esc(x.unit||'u.')}</td><td>${esc(x.min)} ${esc(x.unit||'u.')}</td><td>${badge(Number(x.qty)<=Number(x.min)?'Stock critique':'Disponible')}</td><td class="actions-cell"><button class="btn secondary small" data-action="stock-edit" data-id="${x.id}">Modifier</button></td></tr>`).join('')}</tbody></table>`:empty('Aucun article','Ajoutez des consommables et définissez leur seuil d’alerte.');}
  function settingsView(){const cloud=hasCloud();return `${header('Réglages','Sauvegardes, équipe et synchronisation.',`<button class="btn secondary" data-action="backup-export">⇩ Exporter</button><button class="btn" data-action="sync">↻ Synchroniser</button>`)}<div class="grid layout-two"><section><div class="card"><h2 style="margin-top:0;font-size:18px">Entreprise</h2><form id="company-form" class="form-grid"><div class="field"><label>Nom</label><input class="input" name="companyName" value="${esc(state.settings.companyName)}" required></div><div class="field"><label>Téléphone</label><input class="input" name="companyPhone" value="${esc(state.settings.companyPhone)}"></div><div class="field"><label>E-mail</label><input class="input" name="companyEmail" type="email" value="${esc(state.settings.companyEmail)}"></div><div class="field"><label>Adresse</label><input class="input" name="companyAddress" value="${esc(state.settings.companyAddress)}"></div><div class="field full"><label><input type="checkbox" name="notifications" ${state.settings.notifications?'checked':''}> Me prévenir à l’ouverture pour les interventions prévues aujourd’hui</label></div><div class="full"><button class="btn" type="submit">Enregistrer</button></div></form></div><div class="card" style="margin-top:16px"><h2 style="margin-top:0;font-size:18px">Sauvegarde locale</h2><p class="muted">Exportez régulièrement vos données. Le fichier inclut les photos et les signatures.</p><div class="actions-inline"><button class="btn secondary" data-action="backup-export">Exporter une sauvegarde</button><label class="btn secondary">Importer une sauvegarde<input id="backup-import" type="file" accept="application/json" hidden></label></div></div></section><section><div class="card"><h2 style="margin-top:0;font-size:18px">Espace équipe</h2>${cloud?`<div class="notice good">Connecté à <b>${esc(state.settings.cloud.url)}</b><br>Révision cloud : ${esc(state.settings.cloud.revision||0)}</div><p class="muted">Les changements s’envoient automatiquement dès qu’une connexion est disponible. En cas de modifications concurrentes, l’application vous prévient avant tout écrasement.</p><div class="actions-inline">${currentUser()?.role==='Administrateur'?'<button class="btn secondary" data-action="cloud-user-new">+ Créer un accès équipe</button>':''}<button class="btn secondary" data-action="cloud-logout">Se déconnecter de cet appareil</button></div>`:`<div class="notice blue">Mode local actif. Vous pouvez travailler sans réseau sur cet appareil.</div><p class="muted">Pour partager les données entre plusieurs téléphones, ouvrez l’espace équipe et connectez ce poste à votre serveur Froid Plus Climatisation.</p><button class="btn secondary" data-action="cloud-connect">Connecter un espace équipe</button>`}</div><div class="card" style="margin-top:16px"><div class="section-title" style="margin-top:0"><h2>Techniciens</h2><button class="btn secondary small" data-action="tech-new">+ Ajouter</button></div>${technicianRows()}</div></section></div>`;}
  function technicianRows(){return state.technicians.length?`<div class="alert-list">${state.technicians.map(x=>`<div class="alert-row"><div><b>${esc(x.name)}</b><div class="muted small-text">${esc(x.role||'Technicien')} · ${esc(x.phone||'')}</div></div><button class="btn ghost small" data-action="tech-remove" data-id="${x.id}">Retirer</button></div>`).join('')}</div>`:'<p class="muted">Ajoutez les techniciens qui apparaîtront dans les interventions.</p>';}
  const empty=(title,text)=>`<div class="empty"><strong>${title}</strong>${text}</div>`;
  const weekStart=value=>{const d=new Date(`${value}T12:00`),day=d.getDay()||7;d.setDate(d.getDate()-day+1);return d.toISOString().slice(0,10);};
  const addDays=(value,n)=>{const d=new Date(`${value}T12:00`);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};

  function bindView(){
    $('#client-search')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();$('#clients-table').innerHTML=clientRows(state.clients.filter(x=>`${x.name} ${x.phone} ${x.address}`.toLowerCase().includes(q)));});
    $('#job-search')?.addEventListener('input',filterJobs);$('#job-status-filter')?.addEventListener('change',filterJobs);$('#planning-date')?.addEventListener('change',renderApp);
    $('#company-form')?.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget);await mutate(()=>{Object.assign(state.settings,{companyName:f.get('companyName').trim(),companyPhone:f.get('companyPhone').trim(),companyEmail:f.get('companyEmail').trim(),companyAddress:f.get('companyAddress').trim(),notifications:f.has('notifications')});});toast('Réglages enregistrés.','good');if(f.has('notifications'))requestNotifications();});
    $('#backup-import')?.addEventListener('change',importBackup);
    document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>{active=x.dataset.go;renderApp();});
    document.querySelectorAll('[data-action]').forEach(x=>x.onclick=()=>handleAction(x.dataset.action,x.dataset.id));
  }
  function filterJobs(){const q=($('#job-search')?.value||'').toLowerCase(),s=$('#job-status-filter')?.value||'';const jobs=state.jobs.filter(x=>(!s||x.status===s)&&`${clientName(x.clientId)} ${x.technician||''} ${x.type||''}`.toLowerCase().includes(q));$('#jobs-table').innerHTML=jobRows(jobs.sort(sortJobs));document.querySelectorAll('#jobs-table [data-action]').forEach(x=>x.onclick=()=>handleAction(x.dataset.action,x.dataset.id));}
  async function handleAction(action,id){
    if(action==='client-new')return openClient();if(action==='client-edit')return openClient(id);if(action==='client-waze')return openWaze(id);if(action==='equipment-new')return openEquipment();if(action==='equipment-edit')return openEquipment(id);if(action==='job-new')return openJob();if(action==='job-open')return openJob(id);if(action==='job-waze')return openWaze(state.jobs.find(x=>x.id===id)?.clientId);if(action==='document-new')return openDocument();if(action==='document-open')return openDocument(id);if(action==='stock-new')return openStock();if(action==='stock-edit')return openStock(id);if(action==='tech-new')return openTechnician();
    if(action==='tech-remove'){if(confirm('Retirer ce technicien ?'))await mutate(()=>state.technicians=state.technicians.filter(x=>x.id!==id));return;}
    if(action==='cloud-user-new')return openCloudUser();
    if(action==='sync')return syncNow();if(action==='backup-export')return exportBackup();if(action==='cloud-connect'){session=null;sessionStorage.removeItem('astra-session');return renderAuth('cloud');}if(action==='cloud-logout'){session=null;sessionStorage.removeItem('astra-session');toast('Session équipe fermée. Les données locales restent disponibles.');return renderAuth('local');}
  }

  function resizeImage(file){return new Promise((ok,fail)=>{const reader=new FileReader();reader.onerror=fail;reader.onload=()=>{const img=new Image();img.onerror=fail;img.onload=()=>{const ratio=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*ratio);c.height=Math.round(img.height*ratio);c.getContext('2d').drawImage(img,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.78));};img.src=reader.result;};reader.readAsDataURL(file);});}
  function setupSignature(){const canvas=$('#signature-canvas');if(!canvas)return;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);if(signatureValue){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,canvas.width,canvas.height);img.src=signatureValue;}ctx.lineWidth=7;ctx.lineCap='round';ctx.strokeStyle='#182b42';let drawing=false,last;function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height};}canvas.onpointerdown=e=>{drawing=true;last=point(e);canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(!drawing)return;const p=point(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;signatureValue=canvas.toDataURL('image/png');};canvas.onpointerup=canvas.onpointercancel=()=>{drawing=false;};}

  function exportBackup(){const blob=new Blob([JSON.stringify({app:'Froid Plus Climatisation',version:APP_VERSION,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`astra-clim-sauvegarde-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Sauvegarde exportée.','good');}
  async function importBackup(e){const file=e.target.files?.[0];if(!file)return;try{const raw=JSON.parse(await file.text());if(!raw.data||!Array.isArray(raw.data.clients))throw Error('Ce fichier ne semble pas être une sauvegarde Froid Plus Climatisation.');if(!confirm('Remplacer les données actuelles de cet appareil par cette sauvegarde ?'))return;const localProfile=state.localProfile,cloud=state.settings.cloud;state=normalize(raw.data);state.localProfile=localProfile;state.settings.cloud=cloud;state.dirty=true;await persist();toast('Sauvegarde importée.','good');}catch(err){toast(err.message||'Import impossible.','bad');}finally{e.target.value='';}}
  async function api(path,options={}){const base=state.settings.cloud?.url||location.origin;const res=await fetch(`${base}${path}`,{...options,headers:{'Content-Type':'application/json',Authorization:`Bearer ${session?.token||''}`,...(options.headers||{})}});const json=await res.json().catch(()=>({}));if(!res.ok)throw Object.assign(Error(json.error||'Erreur serveur.'),{status:res.status,details:json});return json;}
  async function syncNow(){if(!hasCloud())return toast('Connectez un espace équipe pour synchroniser.','bad');if(!navigator.onLine)return toast('Pas de connexion : les données restent enregistrées localement.','bad');const pill=document.querySelector('.sync-pill');pill?.classList.add('spinning');try{const cloud=state.settings.cloud;const remote=await api('/api/snapshot');if(!state.dirty){state={...normalize(remote.data),localProfile:state.localProfile};state.settings={...state.settings,cloud:{...cloud,revision:remote.revision}};await persist();toast('Données récupérées depuis l’espace équipe.','good');return;}if(remote.revision!==Number(cloud.revision||0)){toast('Conflit détecté : vos modifications locales n’ont pas été envoyées. Ouvrez la sauvegarde avant de choisir quelle version conserver.','bad');return;}const saved=await api('/api/snapshot',{method:'PUT',body:JSON.stringify({revision:cloud.revision,data:cloudData()})});state.settings.cloud={...cloud,revision:saved.revision};state.dirty=false;await persist();toast('Synchronisation effectuée.','good');}catch(err){toast(err.message||'Synchronisation impossible.','bad');}finally{pill?.classList.remove('spinning');}}
  let syncTimer;function queueSync(){clearTimeout(syncTimer);if(hasCloud()&&navigator.onLine)syncTimer=setTimeout(syncNow,1800);}
  async function requestNotifications(){if(!('Notification'in window))return;if(Notification.permission==='default')await Notification.requestPermission();if(Notification.permission==='granted'){const jobs=state.jobs.filter(x=>x.date===today()&&x.status!=='Terminée');if(jobs.length)new Notification('Froid Plus Climatisation',{body:`${jobs.length} intervention(s) prévue(s) aujourd’hui.`});}}
  window.addEventListener('online',()=>{toast('Connexion rétablie.');queueSync();});window.addEventListener('offline',()=>toast('Mode hors connexion : vos changements sont conservés ici.','bad'));setInterval(()=>{if(hasCloud()&&state.dirty&&navigator.onLine)syncNow();},60000);
  init();
  </script>
</body>
